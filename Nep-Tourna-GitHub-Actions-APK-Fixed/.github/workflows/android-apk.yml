name: Nep Tourna Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find package.json
        id: project
        shell: bash
        run: |
          PACKAGE=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found"
            exit 1
          fi

          FOLDER=$(dirname "$PACKAGE")

          echo "Found: $PACKAGE"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.folder }}
        run: npm install

      - name: Capacitor
        working-directory: ${{ steps.project.outputs.folder }}
        run: npx cap --version

      - name: Create Android
        working-directory: ${{ steps.project.outputs.folder }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        working-directory: ${{ steps.project.outputs.folder }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.folder }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nep-Tourna-Android-APK
          path: ${{ steps.project.outputs.folder }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
