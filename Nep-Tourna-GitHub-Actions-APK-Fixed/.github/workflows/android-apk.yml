name: Nep Tourna Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project
        id: project
        shell: bash
        run: |
          PROJECT=$(find . -name package.json -not -path "*/node_modules/*" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          echo "Project folder: $PROJECT"
          echo "folder=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.folder }}
        run: npm install

      - name: Show package scripts
        working-directory: ${{ steps.project.outputs.folder }}
        run: cat package.json

      - name: Build if available
        working-directory: ${{ steps.project.outputs.folder }}
        shell: bash
        run: |
          if npm run 2>/dev/null | grep -q "build"; then
            echo "Build script found."
            npm run build
          else
            echo "No build script found."
            echo "Continuing without npm build."
          fi

      - name: Check Capacitor
        working-directory: ${{ steps.project.outputs.folder }}
        run: npx cap --version

      - name: Add Android
        working-directory: ${{ steps.project.outputs.folder }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Capacitor Sync
        working-directory: ${{ steps.project.outputs.folder }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.folder }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nep-Tourna-Android-APK
          path: ${{ steps.project.outputs.folder }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
