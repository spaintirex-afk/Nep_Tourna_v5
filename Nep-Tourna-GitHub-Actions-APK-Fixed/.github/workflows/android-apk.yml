name: Nep Tourna Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Nep Tourna APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project folder
        id: find-project
        shell: bash
        run: |
          echo "Searching for package.json..."

          PACKAGE=$(find . -name package.json -not -path "./node_modules/*" | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json was not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")

          echo "Found package.json:"
          echo "$PACKAGE"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: npm install

      - name: Show npm scripts
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: npm run

      - name: Detect build script
        id: detect-build
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+build'; then
            echo "has_build=true" >> "$GITHUB_OUTPUT"
            echo "Build script found."
          else
            echo "has_build=false" >> "$GITHUB_OUTPUT"
            echo "No build script found."
          fi

      - name: Build web application
        if: steps.detect-build.outputs.has_build == 'true'
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: npm run build

      - name: Check Capacitor
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: npx cap --version

      - name: Create Android project
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android project already exists."
          fi

      - name: Sync Capacitor
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.project_dir }}/android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nep-Tourna-Android-APK
          path: ${{ steps.find-project.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
